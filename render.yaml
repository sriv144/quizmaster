services:
  - type: web
    name: quizmaster-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quizmaster-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: quizmaster-db
    databaseName: quizmaster
    user: quizmaster
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
