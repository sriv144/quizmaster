services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quizmaster
      POSTGRES_USER: quizmaster
      POSTGRES_PASSWORD: quizmaster
    ports: ["5432:5432"]
    volumes: ["quizmaster-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmaster"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quizmaster
      MINIO_ROOT_PASSWORD: quizmaster-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["quizmaster-minio:/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  quizmaster-postgres:
  quizmaster-minio:
